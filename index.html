<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>兔子洞｜全新独立版</title>
<link rel="icon" href="https://s41.ax1x.com/2026/05/17/pexShsx.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#f0f2f5;color:#111827;}
#app{height:100%;display:flex;flex-direction:column;}

/*顶部栏+搜索*/
.topbar{height:52px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;}
.menu-btn{border:1px solid #e5e7eb;padding:6px 10px;border-radius:10px;background:#f9fafb;cursor:pointer;font-size:14px;}
.search-wrap{flex:1;}
.search-wrap input{width:100%;padding:6px 10px;border-radius:8px;border:1px solid #ddd;font-size:13px;outline:none;}

/*侧边抽屉*/
.drawer-mask{position:fixed;inset:0;background:rgba(17,24,39,0.45);z-index:40;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.drawer-mask.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:#fff;z-index:50;transform:translateX(-100%);transition:transform 0.3s ease;display:flex;flex-direction:column;box-shadow:4px 0 14px rgba(0,0,0,0.12);}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;}
.drawer-header img{width:26px;height:26px;border-radius:6px;}
.drawer-header .close{margin-left:auto;padding:4px 8px;cursor:pointer;}
.drawer-body{flex:1;overflow-y:auto;padding:8px;}
.drawer-item{padding:9px 10px;border-radius:9px;display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:2px;}
.drawer-item.sub{padding-left:28px;}
.drawer-item:hover{background:#f3f4f6;}
.drawer-item.active{background:#111827;color:#fff;}
.drawer-item .del-cat{margin-left:auto;font-size:11px;padding:2px 5px;border-radius:4px;color:#ef4444;cursor:pointer;}
.drawer-footer{padding:10px;border-top:1px solid #eee;}
.new-cat-btn{width:100%;padding:9px;border:1px dashed #ccc;border-radius:9px;background:#fff;cursor:pointer;}

/*主内容*/
.main{flex:1;overflow-y:auto;padding:12px;}

/*上传区域，点击分离！只有uploadTrigger点击唤起文件选择，按钮不会冒泡*/
.upload-zone{background:#fff;border:2px dashed #d1d5db;border-radius:14px;padding:14px;margin-bottom:14px;}
.upload-trigger{text-align:center;padding:10px;cursor:pointer;}
.upload-trigger .icon{font-size:28px;}
.upload-file-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}
.tag{background:#eef2f6;padding:3px 8px;border-radius:999px;font-size:12px;display:flex;gap:4px;align-items:center;}
.tag .remove{color:#ef4444;cursor:pointer;}
.upload-btns{margin-top:12px;display:flex;gap:10px;justify-content:center;}
.btn{padding:7px 16px;border-radius:9px;border:none;cursor:pointer;font-weight:600;font-size:13px;}
.btn-primary{background:#111827;color:#fff;}
.btn-gray{background:#e5e7eb;color:#111827;}

/*工具栏*/
.tool-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.mini-btn{padding:5px 10px;border-radius:7px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:12px;}
.mini-btn.blue{background:#2563eb;color:#fff;border-color:#2563eb;}
.mini-btn.red{background:#dc2626;color:#fff;border-color:#dc2626;}

/*文件列表*/
.file-item{background:#fff;border-radius:10px;padding:9px;display:flex;align-items:center;gap:10px;margin-bottom:6px;border:1px solid #eef2f6;}
.thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#eee;flex-shrink:0;}
.name-wrap{flex:1;overflow:hidden;}
.filename{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-actions{display:flex;gap:4px;}
.file-actions button{padding:4px 7px;border-radius:6px;border:1px solid #ddd;background:#fff;font-size:11px;cursor:pointer;}

/*弹窗*/
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-wrap.open{display:flex;}
.modal-box{background:#fff;padding:18px;border-radius:12px;width:100%;max-width:340px;}
.modal-box input,.modal-box select{width:100%;padding:7px;margin:8px 0;border:1px solid #ddd;border-radius:7px;}
.modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}

/*toast提示*/
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.25s;z-index:200;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="menu-btn" id="openDrawerBtn">☰</button>
    <div class="search-wrap">
      <input id="searchInput" placeholder="搜索文件名..." />
    </div>
  </div>
  <div class="main">
    <div class="upload-zone">
      <div class="upload-trigger" id="uploadTrigger">
        <div class="icon">📁</div>
        <div>点击选择文件</div>
      </div>
      <input type="file" id="fileInput" multiple style="display:none">
      <div class="upload-file-tags" id="uploadTags"></div>
      <div class="upload-btns">
        <button class="btn btn-primary" id="confirmUploadBtn">确认上传</button>
        <button class="btn btn-gray" id="clearUploadBtn">清空</button>
      </div>
    </div>
    <div class="tool-row">
      <button class="mini-btn" id="selectAllBtn">全选</button>
      <button class="mini-btn blue" id="batchDownloadBtn">批量下载</button>
      <button class="mini-btn red" id="batchDeleteBtn">批量删除</button>
    </div>
    <div id="fileList"></div>
  </div>
</div>

<!--侧边栏-->
<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <img src="https://s41.ax1x.com/2026/05/17/pexShsx.png">
    <span>兔子洞全新版</span>
    <span class="close" id="closeDrawerBtn">✕</span>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer">
    <button class="new-cat-btn" id="newCatBtn">+新建分类</button>
  </div>
</div>

<!--重命名弹窗-->
<div class="modal-wrap" id="renameModal">
  <div class="modal-box">
    <h4>重命名</h4>
    <input id="renameInput"/>
    <div class="modal-buttons">
      <button class="btn btn-gray" id="cancelRename">取消</button>
      <button class="btn btn-primary" id="saveRename">保存</button>
    </div>
  </div>
</div>

<!--新建分类弹窗-->
<div class="modal-wrap" id="newCatModal">
  <div class="modal-box">
    <h4>新建分类</h4>
    <input id="catNameInput" placeholder="分类名称">
    <select id="catParentSelect"></select>
    <div class="modal-buttons">
      <button class="btn btn-gray" id="cancelNewCat">取消</button>
      <button class="btn btn-primary" id="saveNewCat">创建</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
//全新独立数据库，不和旧兔子洞共用存储
const DB_NAME = "RabbitHole_NEW_2026";
const CAT_STORAGE_KEY = "rabbit_hole_new_cats";
const ACTIVE_CAT_KEY = "rabbit_hole_new_active_cat";
let db;
let pendingFiles = [];
let selectedSet = new Set();
let renameTargetId = null;

//toast
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

//IndexedDB初始化
async function initDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME,1);
    req.onupgradeneeded = e=>{
      db = e.target.result;
      if(!db.objectStoreNames.contains('files')) db.createObjectStore('files',{keyPath:'id'});
    }
    req.onsuccess = e=>{db=e.target.result;resolve(true);}
    req.onerror = reject;
  })
}

//分类读写
function loadCategories(){
  const raw = localStorage.getItem(CAT_STORAGE_KEY);
  return raw ? JSON.parse(raw) : [{id:"all",name:"全部文件",parentId:null}];
}
function saveCategories(arr){
  localStorage.setItem(CAT_STORAGE_KEY, JSON.stringify(arr));
}
function getActiveCatId(){
  return localStorage.getItem(ACTIVE_CAT_KEY) || "all";
}
function setActiveCatId(id){
  localStorage.setItem(ACTIVE_CAT_KEY,id);
}

//文件存储
async function saveFileRecord(record){
  const tx = db.transaction('files','readwrite');
  tx.objectStore('files').put(record);
  await tx.complete;
}
async function getFileById(id){
  const tx = db.transaction('files','readonly');
  return tx.objectStore('files').get(id);
}
async function getAllFileRecords(){
  const tx = db.transaction('files','readonly');
  return tx.objectStore('files').getAll();
}
async function deleteFileRecord(id){
  const tx = db.transaction('files','readwrite');
  tx.objectStore('files').delete(id);
  await tx.complete;
}

//生成缩略图（图片/视频）
async function makeThumb(file){
  return new Promise(res=>{
    if(!file.type.startsWith("image/") && !file.type.startsWith("video/")) return res("");
    const objUrl = URL.createObjectURL(file);
    const canvas = document.createElement('canvas');
    canvas.width=120;canvas.height=120;
    const ctx = canvas.getContext('2d');
    if(file.type.startsWith("image/")){
      const img = new Image();
      img.onload = ()=>{
        ctx.drawImage(img,0,0,120,120);
        res(canvas.toDataURL("image/jpeg",0.7));
        URL.revokeObjectURL(objUrl);
      }
      img.src = objUrl;
    }else{
      const vid = document.createElement('video');
      vid.currentTime = 0.5;
      vid.onseeked = ()=>{
        ctx.drawImage(vid,0,0,120,120);
        res(canvas.toDataURL("image/jpeg",0.7));
        URL.revokeObjectURL(objUrl);
      }
      vid.src = objUrl;
    }
  })
}

//渲染侧边树形分类
function renderDrawer(){
  const cats = loadCategories();
  const body = document.getElementById('drawerBody');
  const parentSel = document.getElementById('catParentSelect');
  body.innerHTML = "";
  parentSel.innerHTML = `<option value="">顶级分类</option>`;

  function render(parentId){
    const children = cats.filter(c=>c.parentId===parentId);
    children.forEach(cat=>{
      const div = document.createElement('div');
      div.className = "drawer-item" + (cat.parentId ? " sub":"") + (cat.id===getActiveCatId()?" active":"");
      div.innerHTML = `
        <span>${cat.name}</span>
        ${cat.id!=="all" ? `<span class="del-cat" data-del="${cat.id}">删除</span>`:""}
      `;
      div.onclick = (ev)=>{
        if(ev.target.classList.contains('del-cat')) return;
        setActiveCatId(cat.id);
        renderDrawer();renderFileList();
      }
      body.appendChild(div);
      parentSel.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
      render(cat.id);
    })
  }
  render(null);
  body.querySelectorAll('.del-cat').forEach(b=>{
    b.onclick=e=>{
      e.stopPropagation();
      const delId = b.dataset.del;
      const list = loadCategories().filter(c=>c.id!==delId&&c.parentId!==delId);
      saveCategories(list);
      renderDrawer();
    }
  })
}

//渲染文件列表+搜索
async function renderFileList(){
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const allFiles = await getAllFileRecords();
  const activeCat = getActiveCatId();
  let list = allFiles;
  if(activeCat !== "all") list = allFiles.filter(f=>f.categoryId === activeCat);
  if(keyword) list = list.filter(f=>f.name.toLowerCase().includes(keyword));

  const wrap = document.getElementById('fileList');
  wrap.innerHTML = "";
  selectedSet.clear();

  list.forEach(file=>{
    const div = document.createElement('div');
    div.className = "file-item";
    div.innerHTML = `
      <input type="checkbox" data-fid="${file.id}">
      ${file.thumb ? `<img class="thumb" src="${file.thumb}"/>` : `<div class="thumb">📄</div>`}
      <div class="name-wrap">
        <div class="filename">${file.name}</div>
      </div>
      <div class="file-actions">
        <button data-dl="${file.id}">下载</button>
        <button data-rename="${file.id}">重命名</button>
        <button data-del="${file.id}">删除</button>
      </div>
    `;
    wrap.appendChild(div);
  })

  //事件绑定
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange = ()=>{
      if(cb.checked) selectedSet.add(cb.dataset.fid);
      else selectedSet.delete(cb.dataset.fid);
    }
  })
  wrap.querySelectorAll('[data-dl]').forEach(btn=>btn.onclick=()=>downloadSingle(btn.dataset.dl));
  wrap.querySelectorAll('[data-rename]').forEach(btn=>btn.onclick=()=>openRenameModal(btn.dataset.dl));
  wrap.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>delOneFile(btn.dataset.dl));
  renderUploadTags();
}

function renderUploadTags(){
  const tWrap = document.getElementById('uploadTags');
  tWrap.innerHTML = "";
  pendingFiles.forEach((f,i)=>{
    const span = document.createElement('span');
    span.className="tag";
    span.innerHTML = `${f.name}<span class="remove" data-idx="${i}">✕</span>`;
    tWrap.appendChild(span);
  })
  tWrap.querySelectorAll('.remove').forEach(el=>{
    el.onclick = ()=>{
      pendingFiles.splice(el.dataset.idx,1);
      renderUploadTags();
    }
  })
}

//下载单个（原生无任何限速）
async function downloadSingle(fid){
  const rec = await getFileById(fid);
  const url = URL.createObjectURL(rec.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = rec.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

//批量下载：移除延时，全速直接下载
async function batchDownload(){
  if(selectedSet.size ===0){showToast("请勾选文件");return;}
  for(const id of selectedSet){
    await downloadSingle(id);
    //==== 删除了原来250ms延时，全速下载 ====
  }
  showToast("批量下载完成");
}

async function delOneFile(id){
  await deleteFileRecord(id);
  renderFileList();
}

async function batchDelete(){
  if(selectedSet.size===0){showToast("请勾选");return;}
  for(const id of selectedSet) await deleteFileRecord(id);
  renderFileList();
  showToast("批量删除完成");
}

//重命名
async function openRenameModal(id){
  renameTargetId = id;
  const rec = await getFileById(id);
  document.getElementById('renameInput').value = rec.name;
  document.getElementById('renameModal').classList.add('open');
}
async function saveRename(){
  const newName = document.getElementById('renameInput').value.trim();
  if(!newName) return;
  const rec = await getFileById(renameTargetId);
  rec.name = newName;
  await saveFileRecord(rec);
  document.getElementById('renameModal').classList.remove('open');
  renderFileList();
}

//上传逻辑
document.getElementById('uploadTrigger').onclick = ()=>{
  document.getElementById('fileInput').click();
}
document.getElementById('fileInput').onchange = e=>{
  pendingFiles = Array.from(e.target.files);
  renderUploadTags();
}
document.getElementById('clearUploadBtn').onclick = ()=>{
  pendingFiles = [];
  document.getElementById('fileInput').value = "";
  renderUploadTags();
}
document.getElementById('confirmUploadBtn').onclick = async ()=>{
  if(pendingFiles.length===0){showToast("请先选择文件");return;}
  const activeCat = getActiveCatId();
  for(const f of pendingFiles){
    const thumb = await makeThumb(f);
    const record = {
      id: Date.now().toString(36)+Math.random().toString(36),
      name: f.name,
      size: f.size,
      type: f.type,
      blob: f,
      thumb: thumb,
      categoryId: activeCat==="all"?null:activeCat
    }
    await saveFileRecord(record);
  }
  pendingFiles = [];
  document.getElementById('fileInput').value = "";
  renderUploadTags();
  renderFileList();
  showToast("上传完成");
}

//全选
document.getElementById('selectAllBtn').onclick = ()=>{
  document.querySelectorAll('#fileList input[type=checkbox]').forEach(cb=>{
    cb.checked=true;selectedSet.add(cb.dataset.fid);
  })
}

//侧边栏开关
document.getElementById('openDrawerBtn').onclick = ()=>{
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerMask').classList.add('open');
}
document.getElementById('closeDrawerBtn').onclick = ()=>{
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerMask').classList.remove('open');
}
document.getElementById('drawerMask').onclick = ()=>{
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerMask').classList.remove('open');
}

//新建分类弹窗
document.getElementById('newCatBtn').onclick = ()=>{
  document.getElementById('newCatModal').classList.add('open');
  document.getElementById('catNameInput').value="";
}
document.getElementById('saveNewCat').onclick = ()=>{
  const name = document.getElementById('catNameInput').value.trim();
  const pid = document.getElementById('catParentSelect').value || null;
  if(!name) return;
  const cats = loadCategories();
  cats.push({id:Date.now().toString(36), name, parentId:pid});
  saveCategories(cats);
  document.getElementById('newCatModal').classList.remove('open');
  renderDrawer();
}
document.getElementById('cancelNewCat').onclick = ()=>document.getElementById('newCatModal').classList.remove('open');
document.getElementById('cancelRename').onclick = ()=>document.getElementById('renameModal').classList.remove('open');
document.getElementById('saveRename').onclick = saveRename;

document.getElementById('batchDownloadBtn').onclick = batchDownload;
document.getElementById('batchDeleteBtn').onclick = batchDelete;
document.getElementById('searchInput').oninput = ()=>renderFileList();

(async function boot(){
  await initDB();
  renderDrawer();
  renderFileList();
})();
</script>
</body>
</html>
