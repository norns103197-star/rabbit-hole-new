<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5fffc">
<title>◜ ᴥ  ◝</title>
<style>
:root{
  --bg:#f5fbf9;--paper:#fffefd;--paper2:#f8fffd;--ink:#4e5553;--muted:#8b9591;
  --line:#dce8e4;--mint:#8fd8ca;--mint2:#ccefe8;--mint3:#eaf9f5;
  --danger:#c77d78;--shadow:0 12px 34px rgba(89,126,118,.10);
  --r:20px;--font:15px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#f2fbf8,#fbfefd 55%,#eef9f6);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;font-size:var(--font)}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{min-height:100vh;padding:18px}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center}
.iconbtn,.search,.select,.btn{background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:0 5px 18px rgba(89,126,118,.07);border-radius:16px}
.iconbtn{width:48px;height:48px;font-size:23px;flex:0 0 auto}.brand{font-size:22px;font-weight:600;letter-spacing:1px;white-space:nowrap}
.search{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:1}.search input{width:100%;border:0;outline:0;background:transparent;font-size:15px}
.layout{max-width:1200px;margin:16px auto;display:grid;grid-template-columns:250px 1fr;gap:16px}
.sidebar{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:14px;min-height:calc(100vh - 110px);position:sticky;top:14px;overflow:auto}
.sidehead{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 12px;font-weight:600}
.folder{user-select:none}.folderrow{display:flex;align-items:center;gap:7px;padding:10px 9px;border-radius:13px}.folderrow:hover{background:var(--mint3)}
.chev{width:18px;text-align:center;color:var(--muted)}.foldername{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.count{font-size:12px;color:var(--muted)}.children{padding-left:17px;border-left:1px solid var(--line);margin-left:9px}.collapsed>.children{display:none}
.main{min-width:0}.panel{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn{padding:10px 14px}.btn.primary{background:var(--mint);border-color:transparent;color:#244f49}.btn.danger{background:#f6e3e1;color:#914f4b}.btn:active,.iconbtn:active{transform:translateY(1px)}
input[type=file]{display:none}.sorts{display:flex;gap:8px;margin-left:auto}.select{padding:9px 12px;background:#fff}
.drop{border:1.5px dashed #b9ddd5;border-radius:18px;padding:20px;text-align:center;background:linear-gradient(180deg,#fbfffe,#f4fcfa)}
.drop strong{display:block;margin-bottom:5px}.hint{font-size:13px;color:var(--muted)}
.progress{height:7px;background:#e7f1ef;border-radius:99px;overflow:hidden;margin-top:12px;display:none}.progress i{display:block;height:100%;width:0;background:var(--mint);transition:width .15s}
.path{font-size:13px;color:var(--muted);margin:0 0 10px}.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid #e2ece9;border-radius:16px;background:rgba(255,255,255,.78)}
.item:hover{border-color:#c6e5df}.check{width:20px;height:20px}.meta{min-width:0}.name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:6px}.mini{padding:7px 9px;border-radius:11px;background:#f2f8f6;border:1px solid #deebe8;font-size:13px}.mini.d{color:#9b5550}
.empty{text-align:center;color:var(--muted);padding:36px 10px}.footer-note{font-size:12px;color:var(--muted);line-height:1.7}
.backdrop{position:fixed;inset:0;background:rgba(45,66,62,.22);backdrop-filter:blur(5px);display:none;z-index:30}.drawer{position:fixed;z-index:31;left:0;top:0;bottom:0;width:min(88vw,330px);background:#fbfffe;box-shadow:20px 0 60px rgba(45,66,62,.16);padding:16px;transform:translateX(-102%);transition:transform .22s ease;overflow:auto}.drawer.open{transform:none}.backdrop.open{display:block}
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(31,48,45,.28);backdrop-filter:blur(7px)}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fffefd;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(40,70,63,.2)}.dialog h3{margin:0 0 14px}.preview{max-height:65vh;max-width:100%;display:block;margin:auto;border-radius:14px}.textpreview{white-space:pre-wrap;word-break:break-word;line-height:1.7;background:#f6fbfa;padding:15px;border-radius:14px;max-height:65vh;overflow:auto}.close{float:right;font-size:22px;color:var(--muted)}
.context{position:fixed;z-index:50;display:none;background:#fffefd;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(40,70,63,.18);padding:6px;min-width:170px}.context button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}.context button:hover{background:var(--mint3)}
.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%) translateY(15px);opacity:0;background:#3f5550;color:white;padding:10px 15px;border-radius:13px;transition:.2s;pointer-events:none;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){
 .app{padding:10px}.layout{display:block}.desktopSide{display:none}.panel{border-radius:19px;padding:13px}.brand{font-size:19px}.top{gap:8px}.sorts{width:100%;margin-left:0}.select{flex:1}.item{grid-template-columns:28px 1fr}.actions{grid-column:2;justify-content:flex-end}.drawer{width:84vw}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="iconbtn" id="menuBtn" aria-label="打开侧边栏">☰</button>
    <div class="brand">◜ ᴥ  ◝</div>
    <label class="search">⌕ <input id="search" placeholder="搜索文件 / 文件夹"></label>
  </div>

  <div class="layout">
    <aside class="sidebar desktopSide" id="side"></aside>
    <main class="main">
      <section class="panel">
        <div class="toolbar">
          <button class="btn primary" id="uploadBtn">＋ 批量上传</button>
          <button class="btn" id="newFolderBtn">＋ 新建文件夹</button>
          <button class="btn" id="selectAllBtn">全选</button>
          <button class="btn" id="batchMoveBtn">批量移动</button>
          <button class="btn" id="batchDownloadBtn">批量下载</button>
          <button class="btn danger" id="batchDeleteBtn">批量删除</button>
          <div class="sorts">
            <select class="select" id="sortBy">
              <option value="name">名称</option><option value="time">修改时间</option><option value="size">大小</option><option value="type">类型</option>
            </select>
            <select class="select" id="sortDir">
              <option value="asc">正序</option><option value="desc">倒序</option>
            </select>
          </div>
        </div>
        <input id="fileInput" type="file" multiple>
      </section>

      <section class="panel">
        <div class="drop" id="drop">
          <strong>批量上传文件</strong>
          <div class="hint">一次选择多个文件；支持任意常见格式，也支持 ttf、red 等文件</div>
          <div class="progress" id="progress"><i></i></div>
        </div>
      </section>

      <section class="panel">
        <div class="path" id="path">全部文件</div>
        <div class="list" id="list"></div>
      </section>

      <section class="panel footer-note">
        文件保存在当前浏览器的本地 IndexedDB 中，不上传到 GitHub，也不需要外置云服务。
        GitHub Pages 只负责打开这个页面。不同浏览器/设备之间不会自动同步。
      </section>
    </main>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer"></aside>

<div class="modal" id="modal">
 <div class="dialog">
   <button class="close" id="closeModal">×</button>
   <h3 id="modalTitle">预览</h3>
   <div id="modalBody"></div>
 </div>
</div>
<div class="context" id="context"></div>
<div class="toast" id="toast"></div>

<script>
const DB='rabbit_local_v2', STORE='items';
let db, currentFolder=null, selected=new Set(), expanded=new Set(), allItems=[];
const $=s=>document.querySelector(s);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove('show'),1800)}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}
function openDB(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('parent','parent');s.createIndex('kind','kind')}}
  r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)
 })
}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function getAll(){return new Promise((res,rej)=>{const r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(o){return new Promise((res,rej)=>{const r=tx('readwrite').put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{const r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function bytes(n){if(!n)return '0 B';const u=['B','KB','MB','GB','TB'];let i=0,x=n;while(x>=1024&&i<u.length-1){x/=1024;i++}return x.toFixed(x>=100||i===0?0:1)+' '+u[i]}
function typeOf(n){const x=n.toLowerCase();const p=x.lastIndexOf('.');return p<0?'':x.slice(p+1)}
function children(parent){return allItems.filter(x=>x.parent===parent)}
function folderCount(id){return allItems.filter(x=>x.parent===id).length}
function folderTree(parent=null){
 return allItems.filter(x=>x.kind==='folder'&&x.parent===parent).sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans',{numeric:true}))
}
function folderHTML(parent=null){
 return folderTree(parent).map(f=>{
  const open=expanded.has(f.id), kids=folderHTML(f.id);
  return `<div class="folder ${open?'':'collapsed'}">
   <div class="folderrow" data-folder="${f.id}">
    <span class="chev">${kids?'▸':''}</span><span>▱</span><span class="foldername">${esc(f.name)}</span><span class="count">${folderCount(f.id)}</span>
   </div>${kids?`<div class="children">${kids}</div>`:''}
  </div>`
 }).join('')
}
function sideHTML(){return `<div class="sidehead"><span>分类</span><button class="mini" id="sideHome">首页</button></div>
 <div class="folderrow" data-folder="__all"><span class="chev"></span><span>⌂</span><span class="foldername">全部文件</span><span class="count">${allItems.length}</span></div>
 ${folderHTML(null)}
 <div style="margin-top:14px"><button class="btn" style="width:100%" id="sideNew">＋ 新建文件夹</button></div>`}
function renderSide(){ $('#side').innerHTML=sideHTML(); $('#drawer').innerHTML=sideHTML(); bindSide($('#side'));bindSide($('#drawer')) }
function bindSide(root){
 root.querySelectorAll('[data-folder]').forEach(e=>e.onclick=ev=>{
  ev.stopPropagation();const id=e.dataset.folder;
  if(id==='__all'){currentFolder=null;render();return}
  if(expanded.has(id))expanded.delete(id);else expanded.add(id);
  renderSide(); // 只展开/折叠，不改变首页内容
 });
 root.querySelectorAll('#sideNew').forEach(e=>e.onclick=newFolder);
 root.querySelectorAll('#sideHome').forEach(e=>e.onclick=()=>{currentFolder=null;render();closeDrawer()});
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function visibleItems(){
 const q=$('#search').value.trim().toLowerCase();
 let a=allItems.filter(x=>currentFolder===null||x.parent===currentFolder);
 if(q)a=allItems.filter(x=>x.name.toLowerCase().includes(q));
 const by=$('#sortBy').value, dir=$('#sortDir').value==='asc'?1:-1;
 a.sort((x,y)=>{
  let c=0;
  if(by==='name') c=x.name.localeCompare(y.name,'en',{numeric:true,sensitivity:'base'});
  if(by==='time') c=(x.mtime||0)-(y.mtime||0);
  if(by==='size') c=(x.size||0)-(y.size||0);
  if(by==='type') c=typeOf(x.name).localeCompare(typeOf(y.name),'en',{sensitivity:'base'})||x.name.localeCompare(y.name,'en');
  return c*dir;
 });
 return a;
}
function render(){
 allItems = allItems.length?allItems:[]; renderSide();
 const q=$('#search').value.trim(); $('#path').textContent=q?`搜索：${q}`:(currentFolder?`文件夹：${(allItems.find(x=>x.id===currentFolder)||{}).name||''}`:'全部文件');
 const a=visibleItems();
 if(!a.length){$('#list').innerHTML='<div class="empty">这里还没有内容</div>';return}
 $('#list').innerHTML=a.map(x=>{
  const isFolder=x.kind==='folder';
  const checked=selected.has(x.id)?'checked':'';
  return `<div class="item" data-id="${x.id}">
   <input class="check" type="checkbox" ${checked}>
   <div class="meta"><div class="name">${isFolder?'▱':'□'} ${esc(x.name)}</div><div class="sub">${isFolder?folderCount(x.id)+' 项':bytes(x.size)+' · '+(typeOf(x.name)||'文件')} · ${new Date(x.mtime).toLocaleString()}</div></div>
   <div class="actions">
    ${isFolder?'':'<button class="mini previewBtn">查看</button>'}
    <button class="mini downloadBtn">下载</button>
   </div>
  </div>`
 }).join('');
 $('#list').querySelectorAll('.check').forEach(c=>c.onchange=()=>{const id=c.closest('.item').dataset.id;c.checked?selected.add(id):selected.delete(id)})
 $('#list').querySelectorAll('.previewBtn').forEach(b=>b.onclick=e=>preview(e.currentTarget.closest('.item').dataset.id))
 $('#list').querySelectorAll('.downloadBtn').forEach(b=>b.onclick=e=>downloadId(e.currentTarget.closest('.item').dataset.id))
 $('#list').querySelectorAll('.item').forEach(e=>longPress(e, e.dataset.id))
}
function longPress(el,id){
 let timer;
 const start=()=>{timer=setTimeout(()=>showContext(id,el),550)}
 const cancel=()=>clearTimeout(timer);
 el.addEventListener('pointerdown',start);el.addEventListener('pointerup',cancel);el.addEventListener('pointercancel',cancel);el.addEventListener('pointerleave',cancel);
 el.addEventListener('contextmenu',e=>{e.preventDefault();showContext(id,el)})
}
function showContext(id,el){
 const x=allItems.find(a=>a.id===id);if(!x)return;
 const c=$('#context');c.innerHTML=`<button data-act="rename">重命名</button><button data-act="move">移动位置</button><button data-act="download">下载</button><button data-act="delete">删除</button>`;
 c.style.display='block';let r=el.getBoundingClientRect();c.style.left=Math.min(innerWidth-185,Math.max(8,r.left))+'px';c.style.top=Math.min(innerHeight-190,r.bottom+5)+'px';
 c.querySelector('[data-act=rename]').onclick=()=>{hideContext();renameId(id)}
 c.querySelector('[data-act=move]').onclick=()=>{hideContext();moveIds([id])}
 c.querySelector('[data-act=download]').onclick=()=>{hideContext();downloadId(id)}
 c.querySelector('[data-act=delete]').onclick=()=>{hideContext();deleteIds([id])}
}
function hideContext(){$('#context').style.display='none'}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#context'))hideContext()})
async function newFolder(){
 const name=prompt('新建文件夹名称');if(!name?.trim())return;
 await put({id:uid(),kind:'folder',name:name.trim(),parent:currentFolder,mtime:Date.now(),size:0});
 await reload();toast('文件夹已创建')
}
async function renameId(id){
 const x=allItems.find(a=>a.id===id);if(!x)return;const n=prompt('重命名',x.name);if(!n?.trim()||n.trim()===x.name)return;
 x.name=n.trim();x.mtime=Date.now();await put(x);await reload();toast('已重命名')
}
async function deleteIds(ids){
 if(!confirm(`确定删除 ${ids.length} 项？文件夹内的内容也会删除。`))return;
 const set=new Set(ids);let changed=true;while(changed){changed=false;for(const x of allItems)if(x.parent&&set.has(x.parent)&&!set.has(x.id)){set.add(x.id);changed=true}}
 for(const id of set)await del(id);selected.clear();await reload();toast('已删除')
}
function folderOptions(exclude){
 return allItems.filter(x=>x.kind==='folder'&&x.id!==exclude).map(x=>`${x.id}|${x.name}`).join('\n')
}
async function moveIds(ids){
 const choices=folderOptions(ids[0]);const raw=prompt('输入目标文件夹名称；留空=首页根目录。\n可选：\n'+(choices||'（暂无文件夹）'));let parent=null;
 if(raw?.trim()){const hit=allItems.find(x=>x.kind==='folder'&&x.name===raw.trim());if(!hit){toast('没有找到这个文件夹');return}parent=hit.id}
 for(const id of ids){const x=allItems.find(a=>a.id===id);if(x&&x.kind!=='folder'){x.parent=parent;x.mtime=Date.now();await put(x)}else if(x){x.parent=parent;x.mtime=Date.now();await put(x)}}
 selected.clear();await reload();toast('已移动')
}
function downloadId(id){
 const x=allItems.find(a=>a.id===id);if(!x||x.kind==='folder')return;
 const a=document.createElement('a');a.href=URL.createObjectURL(x.blob);a.download=x.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)
}
async function batchDownload(){
 const ids=[...selected];if(!ids.length){toast('先选择文件');return}
 for(const id of ids)downloadId(id);
}
async function batchDelete(){const ids=[...selected];if(ids.length)deleteIds(ids);else toast('先选择文件')}
async function batchMove(){const ids=[...selected];if(ids.length)moveIds(ids);else toast('先选择文件')}
function selectAll(){visibleItems().forEach(x=>selected.add(x.id));render()}
async function upload(files){
 if(!files?.length)return;
 const arr=[...files];const bar=$('#progress');bar.style.display='block';let done=0;
 for(const f of arr){
  await put({id:uid(),kind:'file',name:f.name,parent:currentFolder,size:f.size,mtime:Date.now(),type:f.type,blob:f});
  done++;$('#progress i').style.width=(done/arr.length*100)+'%';
 }
 await reload();setTimeout(()=>{bar.style.display='none';$('#progress i').style.width='0'},400);toast(`已上传 ${arr.length} 个文件`)
}
function preview(id){
 const x=allItems.find(a=>a.id===id);if(!x)return;$('#modalTitle').textContent=x.name;const body=$('#modalBody');body.innerHTML='';
 const url=URL.createObjectURL(x.blob), ext=typeOf(x.name);
 if(x.type.startsWith('image/'))body.innerHTML=`<img class="preview" src="${url}">`;
 else if(x.type.startsWith('video/'))body.innerHTML=`<video class="preview" controls src="${url}"></video>`;
 else if(x.type.startsWith('audio/'))body.innerHTML=`<audio controls style="width:100%" src="${url}"></audio>`;
 else if(x.type==='application/pdf'||ext==='pdf')body.innerHTML=`<iframe src="${url}" style="width:100%;height:65vh;border:0;border-radius:14px"></iframe>`;
 else if(/^(txt|md|json|csv|log|xml|html|css|js|ts|red)$/i.test(ext)){
  const reader=new FileReader();reader.onload=()=>body.innerHTML=`<div class="textpreview">${esc(reader.result)}</div>`;reader.readAsText(x.blob)
 }else body.innerHTML=`<div class="empty">此格式没有浏览器内置预览。<br><br><button class="btn primary" onclick="downloadId('${x.id}')">下载文件</button></div>`;
 $('#modal').classList.add('open');$('#modal').dataset.url=url
}
$('#closeModal').onclick=()=>{const u=$('#modal').dataset.url;if(u)URL.revokeObjectURL(u);$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#closeModal').click()}
function closeDrawer(){$('#drawer').classList.remove('open');$('#backdrop').classList.remove('open')}
$('#menuBtn').onclick=()=>{$('#drawer').classList.add('open');$('#backdrop').classList.add('open')}
$('#backdrop').onclick=closeDrawer
$('#uploadBtn').onclick=()=>$('#fileInput').click()
$('#fileInput').onchange=e=>upload(e.target.files)
$('#drop').onclick=()=>$('#fileInput').click()
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').style.background='#effaf7'}
$('#drop').ondragleave=()=>$('#drop').style.background=''
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').style.background='';upload(e.dataTransfer.files)}
$('#newFolderBtn').onclick=newFolder
$('#selectAllBtn').onclick=selectAll
$('#batchDownloadBtn').onclick=batchDownload
$('#batchDeleteBtn').onclick=batchDelete
$('#batchMoveBtn').onclick=batchMove
$('#sortBy').onchange=render;$('#sortDir').onchange=render;$('#search').oninput=render
async function reload(){allItems=await getAll();render()}
(async()=>{try{await openDB();await reload()}catch(e){console.error(e);toast('浏览器不允许本地存储，请检查网站权限')}})();
</script>
</body>
</html>
