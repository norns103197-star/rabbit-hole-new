<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Small tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;}
body{background:#f7f8fa;color:#222;min-height:100vh;padding:16px;}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.menu-btn{width:44px;height:44px;border:none;background:#fff;border-radius:12px;font-size:22px;box-shadow:0 1px 3px #0002;}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;padding:12px 40px 12px 16px;border-radius:99px;border:1px solid #e5e7eb;font-size:16px;background:#fff;}
.search-wrap .close{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:20px;color:#999;}

/* 侧边栏 */
.sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;background:#fff;z-index:20;transition:left 0.25s;padding:24px 16px;box-shadow:2px 0 10px #0002;overflow-y:auto;}
.sidebar.open{left:0;}
.mask{position:fixed;inset:0;background:#0004;z-index:19;display:none;}
.mask.open{display:block;}
.folder-root{margin-bottom:16px;}
.top-add-row{display:flex;align-items:center;gap:6px;padding:8px 4px;font-size:18px;font-weight:bold;cursor:pointer;}
.add-icon{font-size:22px;color:#222;}
.folder-item{padding:10px 6px;border-radius:8px;cursor:pointer;margin:4px 0;display:flex;align-items:center;gap:8px;}
.folder-item:hover{background:#f1f1f1;}
.folder-item.selected{background:#e9edff;}
.sub-file-list{padding-left:24px;margin:4px 0 12px 0;}
.sub-file-item{padding:6px 4px;font-size:14px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* 上传区域 */
.upload-area{border:2px dashed #ccd1e0;border-radius:16px;padding:30px 16px;text-align:center;margin-bottom:24px;background:#fff;}
.upload-icon{font-size:48px;color:#9ca3af;margin-bottom:8px;}
.upload-buttons{display:flex;gap:16px;justify-content:center;margin:16px 0;flex-wrap:wrap;}
.btn-dark{background:#111827;color:white;border:none;padding:14px 28px;border-radius:99px;font-size:16px;}
.btn-gray{background:#efefef;color:#333;border:none;padding:14px 28px;border-radius:99px;font-size:16px;}
.btn-red{background:#dc2626;color:#fff;border:none;padding:14px 28px;border-radius:99px;font-size:16px;}
.btn-blue{background:#2563eb;color:#fff;border:none;padding:14px 28px;border-radius:99px;font-size:16px;}
.file-list{margin:12px 0;text-align:left;max-height:220px;overflow:auto;}
.file-line{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:#eee 1px solid;}
.del-x{color:#ef4444;border:none;background:none;font-size:22px;padding:0 8px;}
.confirm-upload{margin-top:12px;}
.upload-tip{color:#22a848;font-weight:bold;margin-top:10px;height:24px;}

/* 排序下拉 */
.sort-bar{background:#fff;padding:12px 16px;border-radius:16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
select{padding:8px;border-radius:8px;border:1px solid #ddd;font-size:15px;}

/* 批量按钮区 */
.batch-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}

/* 文件列表 */
.file-container{background:#fff;border-radius:16px;padding:16px;margin-bottom:20px;}
.file-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eee;}
input[type=checkbox]{width:20px;height:20px;}

/* 指令输入框 */
.cmd-input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #ddd;margin-top:10px;font-size:16px;}

/* 弹窗 */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0005;z-index:30;padding:16px;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:420px;padding:24px;}
.modal h3{margin-bottom:16px;}
.modal-folder-list{max-height:300px;overflow:auto;margin:16px 0;}
.modal-btn-row{display:flex;gap:12px;margin-top:24px;justify-content:flex-end;}

/* 导入导出 */
.backup-row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;}
</style>
</head>
<body>
<header>
<button class="menu-btn" id="openSide">☰</button>
<div class="search-wrap">
<input type="text" id="searchInp" placeholder="搜索全部文件/文件夹">
<button class="close">×</button>
</div>
</header>

<!--排序栏-->
<div class="sort-bar">
  <span>排序：</span>
  <select id="sortKeySelect">
    <option value="name">文件名称</option>
    <option value="size">文件大小</option>
    <option value="time">修改时间</option>
    <option value="type">文件类型</option>
  </select>
  <select id="sortOrderSelect">
    <option value="asc">正序</option>
    <option value="desc">倒序</option>
  </select>
</div>

<!-- 侧边栏 -->
<div class="mask" id="mask"></div>
<div class="sidebar" id="sidebar">
  <div class="folder-root">
    <div class="top-add-row" id="addFolderBtn">
      <span class="add-icon">+</span>
      <span>全部文件</span>
    </div>
    <div id="folderListSide"></div>
  </div>
</div>

<!-- 上传区域 -->
<div class="upload-area">
<div class="upload-icon">📁</div>
<div>点击选择文件</div>
<div class="upload-buttons">
<button class="btn-dark" id="selectFileBtn">选择文件</button>
<button class="btn-gray" id="clearFileBtn">清空</button>
</div>
<div class="file-list" id="pendingFileList"></div>
<div class="confirm-upload">
<button class="btn-dark" id="confirmUploadBtn">确认上传</button>
</div>
<div class="upload-tip" id="uploadTip"></div>
<input type="file" id="nativeFileInp" multiple style="display:none">
</div>

<!-- 批量按钮 -->
<div class="batch-row">
<button class="btn-gray" id="selectAllBtn">全选</button>
<button class="btn-blue" id="batchMoveBtn">批量移动</button>
<button class="btn-blue" id="batchDownloadBtn">批量下载</button>
<button class="btn-red" id="batchDelBtn">批量删除</button>
<button class="btn-dark" id="newFolderBtn">新建文件夹</button>
</div>

<!-- 文件列表 -->
<div class="file-container" id="mainFileList"></div>

<!-- 指令输入 -->
<input class="cmd-input" id="cmdInput" placeholder="输入 download / dl / 下载 回车执行">

<!-- 备份导入导出 -->
<div class="backup-row">
<button class="btn-gray" id="exportBtn">导出备份</button>
<button class="btn-gray" id="importBtn">导入备份</button>
<input type="file" id="importFile" style="display:none">
</div>

<!-- 弹窗：选择上传目标文件夹 -->
<div class="modal" id="folderSelectModal">
<div class="modal-box">
<h3>选择目标文件夹</h3>
<button class="btn-dark" id="modalNewFolder">+ 新建文件夹</button>
<div class="modal-folder-list" id="modalFolderList"></div>
<div class="modal-btn-row">
<button class="btn-gray" id="modalCancel">取消</button>
<button class="btn-dark" id="modalConfirm">确认</button>
</div>
</div>
</div>

<!-- 重命名弹窗 -->
<div class="modal" id="renameModal">
<div class="modal-box">
<h3>重命名</h3>
<input type="text" id="renameInp" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd">
<div class="modal-btn-row">
<button class="btn-gray" id="renameCancel">取消</button>
<button class="btn-dark" id="renameOk">确认</button>
</div>
</div>
</div>

<script>
// 数据
const STORAGE_KEY = "smalltool_file_data";
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
  folders:[
    {id:"all",name:"全部文件",expand:true},
    {id:"food",name:"食色性也",expand:true},
    {id:"star",name:"默认收藏夹",expand:true},
    {id:"uncat",name:"未分类",expand:true}
  ],
  files:[]
};
let pendingFiles = [];
let selectedFolderModal = null;
let renameTarget = null;
let activeFilterFolderId = null;

// DOM
const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);

//排序监听
$("#sortKeySelect").onchange = renderMainFileList;
$("#sortOrderSelect").onchange = renderMainFileList;

//侧边栏
$("#openSide").onclick = ()=>{$("#sidebar").classList.add("open");$("#mask").classList.add("open");}
$("#mask").onclick = ()=>{$("#sidebar").classList.remove("open");$("#mask").classList.remove("open");}

//顶部加号新建文件夹
$("#addFolderBtn").onclick = ()=>{
  const name = prompt("输入新建文件夹名称");
  if(!name)return;
  const id = "fd_"+Date.now();
  data.folders.push({id,name,expand:true});
  saveData();renderSideFolder();
}

//选择文件
$("#selectFileBtn").onclick = ()=>$("#nativeFileInp").click();
$("#nativeFileInp").onchange = e=>{
  for(let f of e.target.files) pendingFiles.push(f);
  renderPendingList();
}
$("#clearFileBtn").onclick = ()=>{pendingFiles=[];renderPendingList();}

//渲染待上传列表
function renderPendingList(){
  const wrap = $("#pendingFileList");
  wrap.innerHTML = "";
  pendingFiles.forEach((file,idx)=>{
    const line = document.createElement("div");
    line.className = "file-line";
    line.innerHTML = `<span>${file.name}</span><button class="del-x" data-idx="${idx}">×</button>`;
    wrap.appendChild(line);
  })
  $$(".del-x").forEach(b=>b.onclick=e=>{
    const i = Number(e.target.dataset.idx);
    pendingFiles.splice(i,1);renderPendingList();
  })
}

//确认上传，打开弹窗
$("#confirmUploadBtn").onclick = ()=>{
  if(!pendingFiles.length) return alert("请先选择文件");
  selectedFolderModal = null;
  renderModalFolderList();
  $("#folderSelectModal").classList.add("open");
}

function renderModalFolderList(){
  const wrap = $("#modalFolderList");
  wrap.innerHTML = "";
  data.folders.forEach(fd=>{
    const div = document.createElement("div");
    div.className = "folder-item";
    if(selectedFolderModal?.id === fd.id) div.classList.add("selected");
    div.textContent = "📂 "+fd.name;
    div.onclick = ()=>{selectedFolderModal = fd;renderModalFolderList();}
    wrap.appendChild(div);
  })
}

//弹窗新建文件夹
$("#modalNewFolder").onclick = ()=>{
  const name = prompt("新建文件夹名称");
  if(!name)return;
  const id = "fd_"+Date.now();
  data.folders.push({id,name,expand:true});
  saveData();renderModalFolderList();renderSideFolder();
}

//弹窗取消：未分类
$("#modalCancel").onclick = ()=>{
  $("#folderSelectModal").classList.remove("open");
  uploadToFolder("uncat");
}
$("#modalConfirm").onclick = ()=>{
  if(!selectedFolderModal) return alert("请选择文件夹");
  $("#folderSelectModal").classList.remove("open");
  uploadToFolder(selectedFolderModal.id);
}

function uploadToFolder(folderId){
  const count = pendingFiles.length;
  pendingFiles.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      data.files.push({
        id:Date.now()+"_"+Math.random(),
        name:file.name,
        folder:folderId,
        data:e.target.result,
        size:file.size,
        time:Date.now(),
        type:file.name.split('.').pop()
      })
      saveData();
      renderMainFileList();
      renderSideFolder();
    }
    reader.readAsDataURL(file);
  })
  $("#uploadTip").innerText = `成功上传 ${count} 个文件`;
  pendingFiles = [];renderPendingList();
  setTimeout(()=>$("#uploadTip").innerText="",2500);
}

//保存
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}

//文件排序函数
function sortFiles(fileArr){
  const key = $("#sortKeySelect").value;
  const order = $("#sortOrderSelect").value === "asc" ? 1 : -1;
  return [...fileArr].sort((a,b)=>{
    if(key==="name") return order * a.name.localeCompare(b.name,"zh-CN");
    if(key==="size") return order * (a.size - b.size);
    if(key==="time") return order * (a.time - b.time);
    if(key==="type") return order * a.type.localeCompare(b.type,"zh-CN");
  })
}

//主文件列表渲染
function renderMainFileList(){
  const wrap = $("#mainFileList");
  wrap.innerHTML = "";
  let showFiles = data.files;
  if(activeFilterFolderId){
    showFiles = data.files.filter(f=>f.folder === activeFilterFolderId);
  }
  showFiles = sortFiles(showFiles);
  showFiles.forEach(f=>{
    const div = document.createElement("div");
    div.className = "file-row";
    div.innerHTML = `<input type="checkbox" data-id="${f.id}"><span>${f.name}</span>`;
    div.ondblclick = ()=>downloadSingle(f);
    //长按重命名
    let longTimer;
    div.onmousedown = div.ontouchstart = ()=>{
      longTimer = setTimeout(()=>openRename("file",f),600);
    }
    div.onmouseup = div.ontouchend = ()=>clearTimeout(longTimer);
    wrap.appendChild(div);
  })
}

//单文件下载
function downloadSingle(file){
  const a = document.createElement("a");
  a.href = file.data;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

//批量下载
function batchDownload(){
  const ids = Array.from($$("#mainFileList input:checked")).map(c=>c.dataset.id);
  const list = data.files.filter(f=>ids.includes(f.id));
  list.forEach(f=>downloadSingle(f));
}
$("#batchDownloadBtn").onclick = batchDownload;

//指令输入
$("#cmdInput").onkeydown = e=>{
  if(e.key!=="Enter")return;
  const val = $("#cmdInput").value.trim().toLowerCase();
  if(["download","dl","下载"].includes(val)) batchDownload();
  $("#cmdInput").value = "";
}

//全选
$("#selectAllBtn").onclick = ()=>{
  const checks = $$("#mainFileList input[type=checkbox]");
  const allChecked = Array.from(checks).every(c=>c.checked);
  checks.forEach(c=>c.checked = !allChecked);
}

//批量删除
$("#batchDelBtn").onclick = ()=>{
  const ids = Array.from($$("#mainFileList input:checked")).map(c=>c.dataset.id);
  data.files = data.files.filter(f=>!ids.includes(f.id));
  saveData();renderMainFileList();renderSideFolder();
}

//批量移动弹窗
$("#batchMoveBtn").onclick = ()=>{
  const ids = Array.from($$("#mainFileList input:checked")).map(c=>c.dataset.id);
  if(!ids.length) return alert("勾选文件");
  selectedFolderModal=null;
  renderModalFolderList();
  $("#folderSelectModal").classList.add("open");
  $("#modalConfirm").onclick = ()=>{
    if(!selectedFolderModal) return;
    $("#folderSelectModal").classList.remove("open");
    data.files.forEach(f=>{if(ids.includes(f.id))f.folder = selectedFolderModal.id;})
    saveData();renderMainFileList();renderSideFolder();
  }
}

//新建文件夹
$("#newFolderBtn").onclick = ()=>{
  const name = prompt("文件夹名称");
  if(!name)return;
  const id = "fd_"+Date.now();
  data.folders.push({id,name,expand:true});
  saveData();renderSideFolder();
}

function renderSideFolder(){
  const wrap = $("#folderListSide");
  wrap.innerHTML = "";
  data.folders.forEach(fd=>{
    const divFolder = document.createElement("div");
    divFolder.className = "folder-item";
    divFolder.textContent = "📂 "+fd.name;
    //长按文件夹重命名
    let longTimer;
    divFolder.onmousedown = divFolder.ontouchstart = ()=>{
      longTimer = setTimeout(()=>openRename("folder",fd),600);
    }
    divFolder.onmouseup = divFolder.ontouchend = ()=>clearTimeout(longTimer);
    //点击文字展开/收起，切换筛选
    divFolder.onclick = ()=>{
      fd.expand = !fd.expand;
      activeFilterFolderId = fd.id;
      renderMainFileList();
      renderSideFolder();
    }
    wrap.appendChild(divFolder);
    //展开子文件，同样应用排序
    if(fd.expand){
      const subWrap = document.createElement("div");
      subWrap.className = "sub-file-list";
      let filesInFolder = data.files.filter(f=>f.folder === fd.id);
      filesInFolder = sortFiles(filesInFolder);
      filesInFolder.forEach(file=>{
        const fileItem = document.createElement("div");
        fileItem.className = "sub-file-item";
        fileItem.textContent = "├ "+file.name;
        subWrap.appendChild(fileItem);
      })
      wrap.appendChild(subWrap);
    }
  })
}

//重命名
function openRename(type,obj){
  renameTarget = {type,obj};
  $("#renameInp").value = obj.name;
  $("#renameModal").classList.add("open");
}
$("#renameCancel").onclick = ()=>{$("#renameModal").classList.remove("open");renameTarget=null;}
$("#renameOk").onclick = ()=>{
  const newname = $("#renameInp").value.trim();
  if(!newname) return;
  renameTarget.obj.name = newname;
  saveData();renderSideFolder();renderMainFileList();
  $("#renameModal").classList.remove("open");
}

//导入导出
$("#exportBtn").onclick = ()=>{
  const json = JSON.stringify(data,null,2);
  const blob = new Blob([json],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "file_backup.json";
  a.click();
}
$("#importBtn").onclick = ()=>$("#importFile").click();
$("#importFile").onchange = e=>{
  const fr = new FileReader();
  fr.onload = ev=>{
    try{
      data=JSON.parse(ev.target.result);
      saveData();
      renderSideFolder();
      renderMainFileList();
      alert("导入成功");
    }catch(err){alert("备份文件错误");}
  }
  fr.readAsText(e.target.files[0])
}

//初始化
renderPendingList();
renderSideFolder();
renderMainFileList();
</script>
</body>
</html>
