<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兔子洞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            height: 100vh;
            overflow: hidden;
            background-color: #f4f5f7;
        }
        .mask {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 9;
            display: none;
        }
        .mask.active {
            display: block;
        }
        .modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius:16px;
            width:85%;
            max-width:400px;
            padding:20px;
            z-index:11;
            display:none;
            max-height:70vh;
            overflow-y:auto;
        }
        .modal.active{
            display:block;
        }
        .modal-folder-item{
            padding:12px 8px;
            border-radius:8px;
            cursor:pointer;
            margin:4px 0;
            font-size:16px;
        }
        .modal-folder-item:active{
            background:#e9e9eb;
        }
        .modal-title{
            font-size:17px;
            font-weight:bold;
            margin-bottom:12px;
        }
        .modal-close{
            margin-top:12px;
            width:100%;
            padding:12px;
            background:#e5e7eb;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        .sidebar {
            position: fixed;
            left: -280px;
            top:0;
            width:280px;
            height:100vh;
            background: #ffffff;
            border-right:1px solid #e5e7eb;
            padding:16px;
            overflow-y: auto;
            z-index: 10;
            transition: left 0.25s ease;
        }
        .sidebar.active {
            left:0;
        }
        .sidebar-header {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:24px;
        }
        .sidebar-header img {
            width:40px;height:40px;border-radius:50%;
            pointer-events: none;
        }
        .folder-tree {
            margin-bottom:12px;
        }
        .folder-item {
            padding:12px 10px;
            margin:4px 0;
            border-radius:8px;
            cursor:pointer;
            display:flex;
            align-items:center;
            gap:6px;
            font-size:16px;
        }
        .folder-item.active {
            background:#111827;
            color:white;
        }
        .add-folder {
            width:100%;
            padding:12px;
            margin-top:12px;
            border:1px solid #ddd;
            border-radius:10px;
            background:#fff;
            font-size:16px;
            cursor:pointer;
        }
        .main {
            width:100%;
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .top-bar {
            display:flex;
            align-items:center;
            gap:10px;
            padding:14px 16px;
            background:#fff;
            border-bottom:1px solid #e5e7eb;
        }
        .menu-btn {
            font-size:22px;
            background:transparent;
            border:none;
            padding:4px;
            cursor:pointer;
        }
        .search-wrap {
            flex:1;
            display:flex;
        }
        #searchInput {
            flex:1;
            padding:10px 12px;
            border:1px solid #ddd;
            border-radius:8px 0 0 8px;
            outline:none;
            font-size:16px;
        }
        .exit-search {
            padding:10px 12px;
            background:#ddd;
            border:none;
            border-radius:0 8px 8px 0;
            font-size:16px;
            cursor:pointer;
        }
        .content-wrap {
            flex:1;
            padding:16px;
            overflow-y:auto;
        }
        .upload-card {
            border:2px dashed #c9cdd4;
            border-radius:16px;
            padding:32px 20px;
            text-align:center;
            margin-bottom:20px;
        }
        .upload-card p {
            color:#666;
            margin:8px 0 16px;
        }
        .upload-buttons {
            display:flex;
            gap:12px;
            justify-content:center;
        }
        button {
            padding:12px 20px;
            border-radius:10px;
            border:none;
            font-size:16px;
            touch-action: manipulation;
            cursor:pointer;
        }
        button:active {
            opacity:0.7;
        }
        .btn-primary {
            background:#111827;
            color:white;
        }
        .btn-gray {
            background:#e5e7eb;
        }
        .batch-action-bar{
            display:none;
            gap:10px;
            margin-bottom:12px;
            flex-wrap:wrap;
        }
        .batch-action-bar.active{
            display:flex;
        }
        .file-area-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:12px;
        }
        .file-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
            gap:14px;
        }
        .file-card {
            background:#fff;
            border-radius:12px;
            overflow:hidden;
            border:1px solid #e5e7eb;
            position:relative;
            touch-action: manipulation;
            cursor:pointer;
        }
        .file-preview {
            height:90px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f9fafb;
            overflow:hidden;
        }
        .file-preview img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .file-name {
            padding:8px;
            font-size:13px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .file-ctx {
            position:absolute;
            top:6px;
            right:6px;
            width:28px;height:28px;
            border-radius:50%;
            background:rgba(0,0,0,0.4);
            color:#fff;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:16px;
        }
        .empty-tip {
            text-align:center;
            color:#999;
            padding:40px 0;
        }
        input[type="file"] {
            display:none;
        }
        .file-card.selected{
            outline:3px solid #2563eb;
        }
    </style>
</head>
<body>
    <div class="mask" id="mask"></div>
    <div class="modal" id="moveModal">
        <div class="modal-title">选择目标文件夹</div>
        <div id="modalFolderList"></div>
        <button class="modal-close" id="closeMoveModal">取消</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <img alt="logo" src="https://s41.ax1x.com/2026/05/17/pexShsx.png">
            <h3>兔子洞</h3>
        </div>
        <div class="folder-tree" id="folderTree"></div>
        <button class="add-folder" id="newFolderBtn">+ 新建文件夹</button>
    </div>

    <div class="main">
        <div class="top-bar">
            <button class="menu-btn" id="openSidebarBtn">☰</button>
            <div class="search-wrap">
                <input id="searchInput" placeholder="搜索文件/文件夹">
                <button class="exit-search" id="exitSearch">退出</button>
            </div>
        </div>
        <div class="content-wrap">
            <div class="upload-card">
                <h3>点击选择文件</h3>
                <p>保存到本地</p>
                <input type="file" id="fileInput" multiple accept="*">
                <div class="upload-buttons">
                    <button class="btn-primary" id="selectFileBtn">选择文件</button>
                    <button class="btn-gray" id="clearBtn">清空</button>
                </div>
            </div>
            <div class="batch-action-bar" id="batchBar">
                <button id="selectAllBtn">全选</button>
                <button id="batchMoveBtn">批量移动</button>
                <button id="batchDelBtn">批量删除</button>
                <button id="batchCancelBtn">取消选择</button>
            </div>
            <div class="file-area-header">
                <h4 id="currentFolder">未分类</h4>
                <button id="batchSelectBtn">批量选择</button>
            </div>
            <div class="file-grid" id="fileGrid">
                <div class="empty-tip">暂无文件</div>
            </div>
        </div>
    </div>

<script>
const STORAGE_KEY = "rabbit-hole-data";
let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
    folders: [
        { id: "root", name: "未分类", parentId: "" },
        { id: "star", name: "收藏夹", parentId: "" }
    ],
    files: [],
    currentFolderId: "root"
};
let batchMode = false;
let selectedIds = new Set();

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => document.querySelectorAll(selector);

// 侧边栏
$("#openSidebarBtn").onclick = ()=>{
    $("#sidebar").classList.add("active");
    $("#mask").classList.add("active");
}
$("#mask").onclick = ()=>{
    $("#sidebar").classList.remove("active");
    $("#moveModal").classList.remove("active");
    $("#mask").classList.remove("active");
}
$("#closeMoveModal").onclick = ()=>{
    $("#moveModal").classList.remove("active");
    $("#mask").classList.remove("active");
}

//新建文件夹
$("#newFolderBtn").onclick = ()=>{
    const name = prompt("输入文件夹名称");
    if(!name || !name.trim()) return;
    const newId = "folder_" + Date.now();
    appData.folders.push({
        id: newId,
        name: name.trim(),
        parentId: appData.currentFolderId
    });
    saveData();
    renderFolderTree();
}

//批量选择开关
$("#batchSelectBtn").onclick = ()=>{
    batchMode = true;
    selectedIds.clear();
    $("#batchBar").classList.add("active");
    renderFiles();
}
$("#batchCancelBtn").onclick = ()=>{
    batchMode = false;
    selectedIds.clear();
    $("#batchBar").classList.remove("active");
    renderFiles();
}

//全选
$("#selectAllBtn").onclick = ()=>{
    if(!batchMode) return;
    const currentFiles = appData.files.filter(f=>f.folderId === appData.currentFolderId);
    selectedIds.clear();
    currentFiles.forEach(item=>selectedIds.add(item.id));
    renderFiles();
}

//批量移动
$("#batchMoveBtn").onclick = ()=>{
    if(selectedIds.size === 0) {
        alert("请先勾选至少一个文件");
        return;
    }
    const wrap = $("#modalFolderList");
    wrap.innerHTML = "";
    appData.folders.forEach(folder=>{
        const div = document.createElement("div");
        div.className = "modal-folder-item";
        div.innerText = `📂 ${folder.name}`;
        div.onclick = ()=>{
            appData.files.forEach(f=>{
                if(selectedIds.has(f.id)) f.folderId = folder.id;
            })
            selectedIds.clear();
            batchMode = false;
            $("#batchBar").classList.remove("active");
            saveData();
            renderFiles();
            $("#moveModal").classList.remove("active");
            $("#mask").classList.remove("active");
        }
        wrap.appendChild(div);
    })
    $("#moveModal").classList.add("active");
    $("#mask").classList.add("active");
}

//批量删除
$("#batchDelBtn").onclick = ()=>{
    if(selectedIds.size === 0) {
        alert("请先勾选至少一个文件");
        return;
    }
    if(confirm(`确定删除选中 ${selectedIds.size} 个文件？`)){
        appData.files = appData.files.filter(item => !selectedIds.has(item.id));
        selectedIds.clear();
        batchMode = false;
        $("#batchBar").classList.remove("active");
        saveData();
        renderFiles();
    }
}

//文件选择
$("#selectFileBtn").onclick = ()=> $("#fileInput").click();
$("#fileInput").onchange = async (e)=>{
    const files = Array.from(e.target.files);
    for(let file of files) {
        let previewUrl = "";
        if(file.type.startsWith("image/")) previewUrl = URL.createObjectURL(file);
        const fileObj = {
            id: Date.now() + Math.random(),
            name: file.name,
            type: file.type,
            blob: file,
            preview: previewUrl,
            folderId: appData.currentFolderId
        };
        appData.files.push(fileObj);
    }
    saveData();
    renderFiles();
    $("#fileInput").value = "";
};
$("#clearBtn").onclick = ()=> $("#fileInput").value = "";

//渲染文件
function renderFiles(keyword="") {
    const container = $("#fileGrid");
    let list = appData.files.filter(f=>f.folderId === appData.currentFolderId);
    if(keyword) list = list.filter(f=>f.name.toLowerCase().includes(keyword.toLowerCase()));
    if(list.length ===0) {
        container.innerHTML = `<div class="empty-tip">暂无文件</div>`;
        return;
    }
    let html = "";
    list.forEach(item=>{
        let previewHtml = item.type.startsWith("image/") ? `<img src="${item.preview}">` : `<div style="font-size:32px;">📄</div>`;
        const selectedClass = selectedIds.has(item.id) ? "selected" : "";
        html += `
        <div class="file-card ${selectedClass}" data-id="${item.id}">
            <div class="file-ctx">⋯</div>
            <div class="file-preview">${previewHtml}</div>
            <div class="file-name">${item.name}</div>
        </div>`;
    });
    container.innerHTML = html;
    $$(".file-card").forEach(card=>{
        card.onclick = function(){
            if(!batchMode) return;
            const fid = Number(this.dataset.id);
            if(selectedIds.has(fid)) selectedIds.delete(fid);
            else selectedIds.add(fid);
            this.classList.toggle("selected");
        }
        card.querySelector(".file-ctx").onclick = function(e){
            e.stopPropagation();
            const fid = Number(card.dataset.id);
            const file = appData.files.find(f=>f.id === fid);
            const op = prompt(`文件【${file.name}】\nrename=重命名 / download=下载`,"rename");
            if(op === "rename"){
                const newName = prompt("输入新名字", file.name);
                if(newName?.trim()){
                    file.name = newName.trim();
                    saveData(); renderFiles();
                }
            }else if(op === "download"){
                const a = document.createElement("a");
                a.href = file.preview || URL.createObjectURL(file.blob);
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
            }
        }
    })
}

//搜索
$("#searchInput").oninput = (e)=> renderFiles(e.target.value);
$("#exitSearch").onclick = ()=>{
    $("#searchInput").value = "";
    renderFiles();
}

//渲染文件夹树
function renderFolderTree(){
    const wrap = $("#folderTree");
    wrap.innerHTML = "";
    function renderSub(parentId, level=0){
        const children = appData.folders.filter(f=>f.parentId === parentId);
        children.forEach(folder=>{
            const div = document.createElement("div");
            div.className = "folder-item";
            if(folder.id === appData.currentFolderId) div.classList.add("active");
            div.style.paddingLeft = `${12 + level*14}px`;
            div.innerText = `📂 ${folder.name}`;
            div.onclick = function(){
                appData.currentFolderId = folder.id;
                $("#currentFolder").innerText = folder.name;
                saveData();
                renderFolderTree();
                renderFiles();
                $("#sidebar").classList.remove("active");
                $("#mask").classList.remove("active");
            }
            wrap.appendChild(div);
            renderSub(folder.id, level+1);
        })
    }
    renderSub("");
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
}

renderFolderTree();
renderFiles();
</script>
</body>
</html>
